<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>St Jean, Ethan — Property Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#f4f4f4; color:#333; }
  header { background:#1a1a1a; color:#fff; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; }
  header .brand { font-weight:700; font-size:14px; color:#7ac943; white-space:nowrap; }
  header .who { font-size:13px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #map { width:100%; height:62vh; min-height:320px; }
  .panel { padding:10px 14px; }
  .addr { font-size:14px; color:#555; margin-bottom:6px; }
  .areas { background:#fff; border:1px solid #ddd; border-radius:8px; overflow:hidden; }
  .areas .row { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; border-bottom:1px solid #eee; font-size:14px; }
  .areas .row:last-child { border-bottom:none; }
  .swatch { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:8px; vertical-align:middle; }
  .sqft { font-weight:600; }
  .total { background:#f0f7ea; padding:9px 12px; font-weight:700; font-size:15px; display:flex; justify-content:space-between; }
  .btn { display:block; text-align:center; margin-top:12px; background:#7ac943; color:#fff; text-decoration:none; font-weight:600; padding:11px; border-radius:8px; font-size:15px; }
  .btn.dark { background:#333; }
  .foot { text-align:center; color:#999; font-size:11px; padding:10px; }
  @media (max-width:520px){ header .who{font-size:11px;} }
</style>
</head>
<body>
<header>
  <div class="brand">KLD Property Map</div>
  <div class="who">St Jean, Ethan</div>
</header>
<div id="map"></div>
<div class="panel">
  <div class="addr">233 16th Ave S, Cranbrook, BC V1C 2Z5</div>
  <div class="areas">
    <div class="row"><span><span class="swatch" style="background:rgba(38, 205, 0, 0.58)"></span>Lawn Area</span><span class="sqft">4,929 sq ft</span></div>
    <div class="total"><span>Total Measured</span><span>4,929 sq ft</span></div>
  </div>
  <a class="btn" href="https://maps.google.com/?q=49.50682,-115.75955" target="_blank">Navigate to this property (Google Maps)</a>
</div>
<div class="foot">Aerial measurement map — Kootenay Lawn Doctor</div>
<script>
var polyData = [{"name": "Lawn Area", "sqft": 4929.01, "fillColor": "rgba(38, 205, 0, 0.58)", "vertices": [[49.50689930868767, -115.75969442667397], [49.507030807600934, -115.75970381440553], [49.50702471163264, -115.75938999595078], [49.506752133988066, -115.75939133705529], [49.50670946195095, -115.75943693460854], [49.506710332809234, -115.7595361763421], [49.50679306427442, -115.75954690517815], [49.50679219341761, -115.75947180332574], [49.50683399452652, -115.75947448553475], [49.50683399452652, -115.75945168675813], [49.50690540467159, -115.75944900454911], [49.50691672578257, -115.75947984995278], [49.50691498407337, -115.75954958738717], [49.50689930868767, -115.75954958738717]]}];
var map = L.map('map', {zoomControl:true}).setView([49.50682, -115.75955], 18);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 20, attribution:'Imagery &copy; Esri'
}).addTo(map);
var group = [];
polyData.forEach(function(p){
  var ring = p.vertices.map(function(v){return [v[0], v[1]];});
  var poly = L.polygon(ring, {color:'#ffffff', weight:2, fillColor:p.fillColor, fillOpacity:0.55})
    .addTo(map).bindPopup('<b>'+p.name+'</b><br>'+p.sqft.toLocaleString()+' sq ft');
  group.push(poly);
});
if (group.length) map.fitBounds(L.featureGroup(group).getBounds().pad(0.25));
</script>
</body>
</html>
